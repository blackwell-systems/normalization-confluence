name: pages

# Publishes the front page (docs/site) and the Convergence Atlas poster (docs/atlas, served at
# /atlas/) to GitHub Pages on every push to main that touches them, the audit or the gate. The
# atlas check runs first, so a page that disagrees with the audit or the gate is never published.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/atlas/**'
      - 'docs/site/**'
      - 'docs/paper/**'
      - 'REGIME-AUDIT.md'
      - 'coq/verify.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atlas names, count and gap status
        run: python3 docs/atlas/check.py
      - name: Build the paper draft
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          ./tectonic -X compile docs/paper/main.tex
      - name: Assemble the site
        run: |
          mkdir -p _site/atlas
          cp docs/site/index.html _site/index.html
          cp docs/site/og.png _site/og.png
          cp docs/site/atlas-preview.jpg _site/atlas-preview.jpg
          cp docs/paper/main.pdf _site/paper.pdf
          cp docs/atlas/poster.html _site/atlas/index.html
          cp docs/atlas/poster.html _site/atlas/poster.html
          cp docs/atlas/regimes.js _site/atlas/regimes.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
