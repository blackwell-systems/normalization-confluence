name: pages

# Publishes the Convergence Atlas poster (docs/atlas) to GitHub Pages on every push to main that
# touches it. The atlas check runs first, so a poster that disagrees with the audit or the gate
# is never published.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/atlas/**'
      - 'REGIME-AUDIT.md'
      - 'coq/verify.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atlas names, count and gap status
        run: python3 docs/atlas/check.py
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp docs/atlas/poster.html _site/index.html
          cp docs/atlas/poster.html _site/poster.html
          cp docs/atlas/regimes.js _site/regimes.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
