name: verify

# Compiles the mechanized confluence proof and gates on it being axiom-free
# (every key theorem "Closed under the global context"). A green check means a
# stranger can trust the proof without running anything themselves.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Coq 8.x line (coqorg/coq images).
  coq:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coq_version: [ '8.18', '8.20' ]
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: ${{ matrix.coq_version }}
          custom_script: |
            startGroup "Compile + axiom-free gate"
              sudo chown -R coq:coq .
              cd coq
              bash verify.sh
            endGroup

  # Rocq 9.x line (rocq/rocq-prover images; Rocq >= 9.0 is not a coqorg/coq tag,
  # so it is selected via custom_image). chown uses the container's own user,
  # which differs from the Coq 8.x images.
  rocq:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ 'rocq/rocq-prover:9.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: ${{ matrix.image }}
          # Rocq 9.x images ship the `rocq` CLI and may not put `coqc` on PATH.
          # Use coqc if present; otherwise shim it to `rocq compile`, which takes
          # the same flags, so the Makefile and verify.sh run unchanged.
          custom_script: |
            startGroup "Compile + axiom-free gate"
              sudo chown -R "$(whoami)" .
              eval "$(opam env 2>/dev/null)" || true
              if ! command -v coqc >/dev/null 2>&1; then
                ROCQ="$(command -v rocq || find / -name rocq -type f -perm -u+x 2>/dev/null | head -1)"
                echo "coqc not on PATH; shimming coqc -> $ROCQ compile"
                mkdir -p "$HOME/.local/bin"
                printf '#!/bin/sh\nexec %s compile "$@"\n' "$ROCQ" > "$HOME/.local/bin/coqc"
                chmod +x "$HOME/.local/bin/coqc"
                export PATH="$HOME/.local/bin:$PATH"
              fi
              echo "compiler: $(command -v coqc)"; coqc --version || true
              cd coq
              bash verify.sh
            endGroup
